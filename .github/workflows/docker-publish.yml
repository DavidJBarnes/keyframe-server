name: Build and Push Docker Image

# Builds on GitHub's bandwidth rather than a home uplink — a local build+push of
# this image takes ~70 minutes at 0.6 MB/s, which is enough friction that the
# published image drifts out of sync with the repo.
on:
  push:
    branches: [main]
    paths:
      # Only rebuild when something in the image actually changes. Docs-only
      # commits are frequent here and would otherwise burn CI for nothing.
      - 'server.py'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:        # allow a manual rebuild

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          # Build context is the repo root because the Dockerfile COPYs server.py
          # from there; the Dockerfile itself lives under docker/.
          file: docker/Dockerfile
          push: true
          tags: |
            davidjbarnes/keyframe-server:latest
            davidjbarnes/keyframe-server:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
