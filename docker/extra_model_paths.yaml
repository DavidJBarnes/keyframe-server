# Point ComfyUI at the bind-mounted host model tree. Mounted read-only, so
# ComfyUI must never be asked to write here.
keyframe:
    base_path: /workspace/models
    # Multiple version dirs so checkpoints can be switched with CKPT_NAME alone,
    # without an image rebuild.
    checkpoints: |
        qwen/v19/
        qwen/v20/
        qwen/v23/
    loras: qwen/
    vae: vae/
    clip: clip/
    text_encoders: text_encoders/
